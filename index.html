<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- ▼ 앱마다 바꿀 곳: ① title  ② apple-mobile-web-app-title  ③ 아래쪽 GAS_URL -->
  <title>명함보관</title>
  <meta name="apple-mobile-web-app-title" content="명함보관">
  <meta name="theme-color" content="#f5f8ff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    html, body { margin: 0; height: 100%; background: #f5f8ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    iframe { border: 0; width: 100%; height: 100%; display: block; }
    #err { display: none; padding: 28px 24px; color: #333; line-height: 1.7; text-align: center; margin-top: 40px; }
    #err b { color: #d0443c; }
    #err a { display: inline-block; margin-top: 14px; padding: 12px 20px; background: #3f6df0; color: #fff; border-radius: 12px; text-decoration: none; font-weight: bold; }
  </style>
  <script>
    // 카카오톡 인앱 브라우저로 열리면 기본 브라우저로 자동 이동
    (function () {
      const ua = navigator.userAgent.toLowerCase(), url = location.href;
      if (ua.indexOf('kakaotalk') > -1) {
        if (ua.indexOf('android') > -1) {
          location.href = 'intent://' + url.replace(/https?:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        } else if (ua.indexOf('iphone') > -1 || ua.indexOf('ipad') > -1) {
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
        }
      }
    })();
  </script>
</head>
<body>
  <iframe id="f" allow="camera; clipboard-write; clipboard-read" style="display:none"></iframe>
  <div id="err">
    <b>앱 주소(GAS_URL)가 올바르지 않아요.</b><br>
    <code>…/macros/s/…/exec</code> 로 끝나는<br>웹 앱 주소를 넣어야 해요.<br>
    (편집기 주소 <code>…/edit</code> 는 열리지 않아요)
  </div>

  <script>
    // ▼ 앱스크립트 [배포 → 배포 관리 → 웹 앱 URL] 을 붙여넣으세요
    const GAS_URL = 'https://script.google.com/macros/s/여기에_웹앱_주소/exec';

    const ok = /^https:\/\/script\.google\.com\/(a\/[\w.\-]+\/)?macros\/s\/[\w\-]+\/exec/.test(GAS_URL);
    if (ok) {
      const f = document.getElementById('f'); f.src = GAS_URL; f.style.display = 'block';
    } else {
      document.getElementById('err').style.display = 'block';
    }
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
