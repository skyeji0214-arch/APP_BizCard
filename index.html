<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>명함보관</title>
  <meta name="theme-color" content="#f5f8ff">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="명함보관">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    html, body {
      margin: 0;
      height: 100%;
      background: #f5f8ff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      display: block;
    }
    #err {
      padding: 24px;
      color: #555;
      line-height: 1.6;
      text-align: center;
      margin-top: 50px;
    }
  </style>
  <script>
    // 카카오톡 및 인앱 브라우저 감지 시 기본 브라우저로 자동 분기 처리
    (function redirectToExternalBrowser() {
      const userAgent = navigator.userAgent.toLowerCase();
      const targetUrl = location.href;

      if (userAgent.indexOf('kakaotalk') > -1) {
        if (userAgent.indexOf('android') > -1) {
          // 안드로이드 카카오톡: 크롬 브라우저 강제 호출
          location.href = 'intent://' + targetUrl.replace(/https?:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        } else if (userAgent.indexOf('iphone') > -1 || userAgent.indexOf('ipad') > -1) {
          // 아이폰 카카오톡: Safari 안내 또는 외부 브라우저 호출
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(targetUrl);
        }
      }
    })();
  </script>
</head>
<body>
  <iframe id="f" allow="camera; clipboard-write; clipboard-read" style="display:none"></iframe>
  <div id="err" style="display:none">
    <code>index.html</code> 안의 <b>GAS_URL</b>을 확인해주세요.
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwvwi2OkY7RHHqSPV7rxcWuXATsaSayQu_m0hrsKEJy2VE4deMpq_-eJrJ1eqhs7hQUgg/exec';

    if (GAS_URL.indexOf('https://script.google.com') === 0) {
      const f = document.getElementById('f');
      f.src = GAS_URL;
      f.style.display = 'block';
    } else {
      document.getElementById('err').style.display = 'block';
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
