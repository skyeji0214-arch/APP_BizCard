<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <title>명함보관</title>
  <meta name="apple-mobile-web-app-title" content="명함보관">
  <meta name="theme-color" content="#fff7fa">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <style>
    html, body { 
      margin: 0; 
      padding: 0; 
      height: 100%; 
      width: 100%; 
      overflow: hidden; 
      background: #fff7fa; 
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }
    iframe { 
      border: 0; 
      width: 100%; 
      height: 100%; 
      display: block; 
      touch-action: auto;
    }
  </style>
</head>
<body>
  <iframe id="app-frame" allow="camera; clipboard-write; clipboard-read"></iframe>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbwvwi2OkY7RHHqSPV7rxcWuXATsaSayQu_m0hrsKEJy2VE4deMpq_-eJrJ1eqhs7hQUgg/exec';

    // 카카오톡 외부 브라우저 이탈 처리
    (function () {
      const ua = navigator.userAgent.toLowerCase(), url = location.href;
      if (ua.indexOf('kakaotalk') > -1) {
        if (ua.indexOf('android') > -1) {
          location.href = 'intent://' + url.replace(/https?:\/\//i, '') + '#Intent;scheme=https;package=com.android.chrome;end';
        } else if (ua.indexOf('iphone') > -1 || ua.indexOf('ipad') > -1) {
          location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url);
        }
      }
    })();

    // 앱 연결
    const frame = document.getElementById('app-frame');
    frame.src = GAS_URL;

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
