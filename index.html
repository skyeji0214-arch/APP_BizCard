
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff7fa">
  <title>명함보관</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: #fff7fa;
      color: #3a2431;
      font-family: -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
      text-align: center;
    }
    main { max-width: 360px; }
    h1 { font-size: 28px; }
    p { line-height: 1.8; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 14px 24px;
      border-radius: 14px;
      background: #d95c8f;
      color: white;
      font-weight: 700;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>명함보관</h1>
    <p id="status">앱을 여는 중입니다...</p>
    <a id="openApp" href="#">명함보관 앱 열기</a>
  </main>

  <script>
    const GAS_URL =
      'https://script.google.com/macros/s/AKfycbwvwi2OkY7RHHqSPV7rxcWuXATsaSayQu_m0hrsKEJy2VE4deMpq_-eJrJ1eqhs7hQUgg/exec';

    const link = document.getElementById('openApp');
    link.href = GAS_URL;

    document.getElementById('status').textContent =
      '앱으로 이동하지 않으면 아래 버튼을 눌러주세요.';

    // iframe을 사용하지 않고 현재 페이지를 직접 이동합니다.
    window.location.replace(GAS_URL);
  </script>
</body>
</html>
